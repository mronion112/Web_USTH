# Stack local: MySQL + Redis + Chroma + Spring Boot backend + React frontend.
#
# Quy tắc DB: database/Web_DataBase_USTH.sql là template cố định chỉ DDL,
# một DB lunara_spa duy nhất cho mọi service. Data do code nạp qua
# factory/fixture, không seed sẵn trong compose. ddl-auto: validate.
# Mock dataset CSV (database/Production, database/Testing) nạp thủ công
# từ host bằng make seed-demo / seed-test, không mount vào entrypoint
# để tránh nạp nhầm Production mỗi lần khởi động.
#
# Chạy từ thư mục gốc:
#   cp templates/.env.example templates/.env
#   docker compose -f templates/docker-compose.yml up
#
# Mặc định chỉ khởi động DB template, Redis và Chroma, chưa có data.
# Khi backend đã có pom.xml, chạy full stack:
#   docker compose -f templates/docker-compose.yml --profile app up --build

name: lunara-spa

services:
  db:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?thiếu trong .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lunara_spa}
      MYSQL_USER: ${MYSQL_USER:-lunara}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?thiếu trong .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/Web_DataBase_USTH.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: templates/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/lunara_spa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-lunara}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?thiếu trong .env}
      JWT_SECRET: ${JWT_SECRET:?thiếu trong .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?thiếu trong .env}
      CHATBOT_DOCS_PATH: /app/docs
      CHROMA_URL: http://chroma:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  chroma_data:
