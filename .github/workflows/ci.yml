# Chạy trên mọi push và pull request. Job db-validate luôn chạy.
# Job build-test tự kích hoạt khi code ứng dụng xuất hiện
# tại backend/app (Spring Boot) hoặc frontend/app (React).

name: CI

on:
  push:
  pull_request:

jobs:
  db-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Nạp schema
        env:
          MYSQL_PWD: test-root
        run: mysql -h127.0.0.1 -uroot < database/Web_DataBase_USTH.sql

      - name: Kiểm tra bảng theo kỳ vọng
        env:
          MYSQL_PWD: test-root
        run: |
          mapfile -t EXPECTED < database/expected_tables.txt
          ACTUAL=$(mysql -h127.0.0.1 -uroot -N -e "SELECT table_name FROM information_schema.tables WHERE table_schema='lunara_spa';")
          MISSING=0
          for table in "${EXPECTED[@]}"; do
            if ! grep -qx "$table" <<< "$ACTUAL"; then
              echo "Thiếu bảng: $table"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "Database OK: đủ ${#EXPECTED[@]} bảng theo kỳ vọng."

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Java
        if: hashFiles('backend/app/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test backend
        if: hashFiles('backend/app/pom.xml') != ''
        run: mvn -B -f backend/app/pom.xml test

      - name: Cài Node
        if: hashFiles('frontend/app/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        if: hashFiles('frontend/app/package.json') != ''
        run: |
          cd frontend/app
          npm ci
          npm run build

      - name: Báo cáo bỏ qua build
        if: hashFiles('backend/app/pom.xml') == '' && hashFiles('frontend/app/package.json') == ''
        run: echo "Chưa có code ứng dụng, chỉ chạy db-validate."
