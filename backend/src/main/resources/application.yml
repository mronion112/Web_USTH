spring.config.import: optional:file:.env.properties,optional:file:backend/.env.properties

server:
  port: ${BACKEND_PORT}

spring:
  application:
    name: lunara-spa
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:lunara-api}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    test-connection: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: 86400000
  chatbot:
    gemini-api-key: ${GEMINI_API_KEY:}
    generation-model: ${GEMINI_GENERATION_MODEL:gemini-2.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    docs-path: ${CHATBOT_DOCS_PATH:docs}
    chunk-size: ${CHATBOT_CHUNK_SIZE:1600}
    chunk-overlap: ${CHATBOT_CHUNK_OVERLAP:250}
    default-top-k: ${CHATBOT_DEFAULT_TOP_K:5}
    chroma:
      enabled: ${CHROMA_ENABLED:false}
      url: ${CHROMA_URL:http://localhost:8000}
      tenant: ${CHROMA_TENANT:default_tenant}
      database: ${CHROMA_DATABASE:default_database}
      collection: ${CHROMA_COLLECTION:lunara_spa_knowledge}
      api-key: ${CHROMA_API_KEY:}
      startup-indexing: ${CHROMA_STARTUP_INDEXING:false}
      upsert-batch-size: ${CHROMA_UPSERT_BATCH_SIZE:100}

