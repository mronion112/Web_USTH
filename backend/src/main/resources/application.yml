server:
  port: 8080

spring:
  application:
    name: lunara-spa
  datasource:
    url: jdbc:mysql://localhost:3306/lunara_spa
    username: root
    password: thichbai
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-client-id
            client-secret: your-client-secret
            scope: email, profile

app:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    access-expiration-ms: 900000
    refresh-expiration-ms: 86400000
