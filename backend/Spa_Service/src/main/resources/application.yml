server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: spa-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lunara_spa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lunara}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173},http://localhost:5176,https://lunara-spa-usth.vercel.app
