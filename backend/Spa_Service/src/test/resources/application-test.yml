spring:
  datasource:
    url: jdbc:h2:mem:lunara_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

app:
  cors:
    allowed-origins: http://localhost:5173
